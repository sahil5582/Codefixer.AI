<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CodeFixer.AI Challenges</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="sidebar-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">CodeFixer.AI</div>
      <nav>
        <ul>
          <li><a href="profile.html">Profile</a></li>
          <li><a href="home.html">Dashboard</a></li>
          <li><a href="code-debugger.html">Code Debugger</a></li>
          <li><a href="quizzes.html">Quizzes</a></li>
          <li><a href="learn.html">Code Learning</a></li>
          <li><a href="challenges.html" class="active">Challenges</a></li>
          <li><a href="game.html">Games</a></li>
          <li><a href="#" id="logout-btn">Logout</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <header class="main-header">
        <h2>Challenges</h2>
        <p>Test your coding skills with real-world challenges and quizzes. Attempt and improve your logic, code understanding, and mastery!</p>
      </header>

      <section class="challenges-list" id="challenge-list">
        <!-- Challenges will be dynamically loaded here -->
      </section>

      <div id="error-message" style="color: red; margin-top: 20px;"></div>
    </main>
  </div>

  <!-- Logout Confirmation Modal -->
  <div class="modal" id="logout-modal">
    <div class="modal-content">
      <p>Are you sure you want to logout?</p>
      <button class="modal-yes" id="logout-yes">Yes</button>
      <button class="modal-no" id="logout-no">No</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBI5jDcA_QNrujfn0cI5-IHUtZlGm8Q6X0",
      authDomain: "codefixer-ai.firebaseapp.com",
      projectId: "codefixer-ai",
      storageBucket: "codefixer-ai.firebasestorage.app",
      messagingSenderId: "591922324510",
      appId: "1:591922324510:web:77dd4480a11b9e2fddfa0f",
      measurementId: "G-ZMNCWK2XHD"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const challengeListEl = document.getElementById('challenge-list');
    const errorMessageEl = document.getElementById('error-message');

    async function fetchChallenges() {
      errorMessageEl.textContent = '';
      challengeListEl.innerHTML = '<p>Loading challenges...</p>';

      try {
        const snapshot = await db.collection('challenges').get();
        if (snapshot.empty) {
          challengeListEl.innerHTML = '<p>No challenges available right now.</p>';
          return;
        }
        challengeListEl.innerHTML = '';
        snapshot.forEach(doc => {
          const challenge = doc.data();
          const card = document.createElement('div');
          card.className = 'progress-card';

          card.innerHTML = `
            <h3 style="color:#6e4fd0; margin-top: 0;">${challenge.title}</h3>
            <p>${challenge.description || ''}</p>
            <p>
              <strong>Difficulty:</strong> ${challenge.difficulty || 'N/A'} <br/>
              <strong>Attempts:</strong> ${challenge.attempts_count || 0}
            </p>
            <button class="primary-btn">Start Challenge</button>
          `;

          card.querySelector('button').onclick = () => {
            window.location.href = `/quiz.html?id=${doc.id}`;
          };

          challengeListEl.appendChild(card);
        });
      } catch (error) {
        console.error('Error loading challenges:', error);
        errorMessageEl.textContent = 'Failed to load challenges. Please try again later.';
        challengeListEl.innerHTML = '';
      }
    }

    fetchChallenges();

    // Logout modal code
    document.getElementById('logout-btn').addEventListener('click', () => {
      document.getElementById('logout-modal').style.display = 'block';
    });

    document.getElementById('logout-yes').addEventListener('click', () => {
      localStorage.removeItem('authToken');
      window.location.href = 'login.html';
    });

    document.getElementById('logout-no').addEventListener('click', () => {
      document.getElementById('logout-modal').style.display = 'none';
    });

  </script>
</body>
</html>
