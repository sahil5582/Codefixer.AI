<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Codefixer.Ai Login</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDKs: v9 compat version -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <div class="login-container">
    <h1>Codefixer.Ai</h1>
    <!-- Login Form -->
    <form id="login-form" class="login-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <button id="open-signup-btn" class="secondary-btn">New Member? Sign Up</button>
  </div>

  <!-- Signup Modal (hidden by default) -->
  <div class="modal" id="signup-modal" style="display:none;">
    <div class="modal-content">
      <h3>Sign Up to CodeFixer.AI</h3>
      <form id="signup-form">
        <input type="text" id="signup-username" placeholder="Username" required>
        <input type="email" id="signup-email" placeholder="Email" required>
        <input type="password" id="signup-password" placeholder="Password" required>
        <button type="submit" class="modal-yes">Sign Up</button>
        <button type="button" class="modal-no" id="signup-cancel">Cancel</button>
      </form>
    </div>
  </div>
</body>
</html>
